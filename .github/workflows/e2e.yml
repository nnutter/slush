name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: E2E (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        transport: [ssh, mosh]
    env:
      E2E_DIR: /tmp/slush-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install mosh
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mosh
          else
            brew install mosh
          fi
      - name: Build and start isolated SSH server
        run: |
          mkdir -p "$E2E_DIR"
          go build -o "$E2E_DIR/slush" .
          bash e2e/start-server.sh "$E2E_DIR"
      - name: Exercise real sessions
        run: python3 e2e/suite.py "$E2E_DIR/slush" "$E2E_DIR/ssh_config" native "${{ matrix.transport }}"
      - name: Server diagnostics and cleanup
        if: always()
        run: |
          sudo cat "$E2E_DIR/sshd.log" || true
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker logs slush-e2e || true
            docker rm -f slush-e2e || true
          elif [[ -f "$E2E_DIR/sshd.pid" ]]; then
            sudo kill "$(cat "$E2E_DIR/sshd.pid")"
          fi
